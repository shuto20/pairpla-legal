<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>ぺあぷら</title>
<style>
:root{--night:#141A3C;--panel:#1E2650;--panel2:#262F62;--ink:#F3EFE2;--sub:#C7CBE8;--rule:#3A4276;--gold:#F6CF6B}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:480px;margin:0 auto;padding:32px 16px 48px}
.logo{color:var(--gold);font:700 16px "Hiragino Mincho ProN","Yu Mincho",serif;margin:0}
h1{font:700 28px/1.4 "Hiragino Mincho ProN","Yu Mincho",serif;margin:12px 0 4px}
h2{font-size:15px;margin:24px 0 8px}
.sub{color:var(--sub);font-size:14px;margin:4px 0}
.step{border:1px solid var(--rule);border-radius:10px;padding:14px;margin-top:10px;background:var(--panel)}
.time{color:var(--gold);font-size:13px;font-weight:700}
.name{font-weight:700;display:block}
.label{color:var(--sub);font-size:13px}
.map{color:var(--gold);font-size:13px}
.row{display:flex;gap:8px;margin-top:10px}
button{font:700 14px inherit;font-family:inherit;min-height:46px;border-radius:10px;border:1px solid var(--rule);background:var(--panel2);color:var(--ink);cursor:pointer}
.row button{flex:1}
button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--night)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:0 14px;border-radius:999px;min-height:44px}
.send{width:100%;min-height:56px;margin-top:24px;background:var(--gold);border-color:var(--gold);color:var(--night);font-size:16px}
.send:disabled{opacity:.5}
.note{color:var(--sub);font-size:12px;margin-top:16px}
.done{color:var(--gold);font-weight:700;margin-top:14px}
[hidden]{display:none}
</style>
</head>
<body>
<main>
  <p class="logo">ぺあぷら</p>
  <div id="root"><p class="sub">読み込んでいます…</p></div>
  <noscript><p class="sub">このページを見るには JavaScript をオンにしてください。</p></noscript>
</main>
<script>
(function () {
  var API = 'https://exsgqczdfxzgcivfkate.supabase.co/functions/v1/pairpla-suggest';
  var root = document.getElementById('root');
  var token = new URLSearchParams(location.search).get('t') || '';

  // 画面の文字は相手が入力したものも含むので、必ず textContent で入れる
  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text != null) e.textContent = text;
    return e;
  }
  function call(body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || '読み込めませんでした'); return j; }); });
  }
  function fail(message) {
    root.textContent = '';
    root.appendChild(el('p', { class: 'sub' }, message));
  }
  function dateLabel(s) {
    var d = new Date(s + 'T00:00:00');
    return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + '日月火水木金土'[d.getDay()] + '）';
  }
  function footer(send, message) {
    var done = el('p', { class: 'done', hidden: '', role: 'status' }, message);
    send.addEventListener('click', function () { done.hidden = true; });
    root.appendChild(send);
    root.appendChild(done);
    root.appendChild(el('p', { class: 'note' }, 'この答えは、リンクを送った人のアプリに届きます。あとから答え直せます。'));
    return done;
  }

  function showPlan(data) {
    var plan = data.plan;
    var votes = (data.answers && data.answers.votes) || {};
    root.textContent = '';
    root.appendChild(el('h1', {}, plan.title));
    root.appendChild(el('p', { class: 'sub' }, dateLabel(plan.date) + '　' + plan.start + 'から'));
    if (plan.concept) root.appendChild(el('p', { class: 'sub' }, plan.concept));
    if (plan.budget) root.appendChild(el('p', { class: 'sub' }, '費用の目安：' + plan.budget));
    root.appendChild(el('h2', {}, '行きたい場所を教えてください'));

    plan.steps.forEach(function (s, i) {
      var box = el('section', { class: 'step' });
      if (s.time) box.appendChild(el('span', { class: 'time' }, s.time));
      box.appendChild(el('span', { class: 'name' }, s.name));
      if (s.label) box.appendChild(el('span', { class: 'label' }, s.label));
      if (s.mapsUri) {
        box.appendChild(document.createTextNode(' '));
        box.appendChild(el('a', { class: 'map', href: s.mapsUri, target: '_blank', rel: 'noopener noreferrer' }, '地図'));
      }
      var row = el('div', { class: 'row' });
      [['yes', '行きたい'], ['no', 'ほかがいい']].forEach(function (o) {
        var b = el('button', { type: 'button', 'aria-pressed': String(votes[i] === o[0]) }, o[1]);
        b.addEventListener('click', function () {
          votes[i] = o[0];
          row.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
        });
        row.appendChild(b);
      });
      box.appendChild(row);
      root.appendChild(box);
    });

    var send = el('button', { class: 'send', type: 'button' }, '返事を送る');
    var done = footer(send, '返事を送りました。');
    send.addEventListener('click', function () { submit(send, done, { votes: votes }); });
  }

  function chips(title, list, chosen) {
    root.appendChild(el('h2', {}, title));
    var box = el('div', { class: 'chips' });
    list.forEach(function (c) {
      var b = el('button', { type: 'button', 'aria-pressed': String(chosen.indexOf(c) >= 0) }, c);
      b.addEventListener('click', function () {
        var i = chosen.indexOf(c);
        if (i >= 0) chosen.splice(i, 1); else chosen.push(c);
        b.setAttribute('aria-pressed', String(i < 0));
      });
      box.appendChild(b);
    });
    root.appendChild(box);
  }

  function showAsk(data) {
    var a = data.answers || {};
    var likes = (a.likes || []).slice();
    var dislikes = (a.dislikes || []).slice();
    root.textContent = '';
    root.appendChild(el('h1', {}, '好きなものを教えてください'));
    root.appendChild(el('p', { class: 'sub' }, 'デートの計画に使います。選ばなくてもかまいません。'));
    chips('好きなもの', data.chips.likes, likes);
    chips('苦手なもの', data.chips.dislikes, dislikes);
    var send = el('button', { class: 'send', type: 'button' }, '答えを送る');
    var done = footer(send, '答えを送りました。');
    send.addEventListener('click', function () { submit(send, done, { likes: likes, dislikes: dislikes }); });
  }

  function submit(send, done, answers) {
    send.disabled = true;
    call({ action: 'share_answer', token: token, answers: answers })
      .then(function () { done.hidden = false; })
      .catch(function (e) { fail(e.message); })
      .finally(function () { send.disabled = false; });
  }

  call({ action: 'share_get', token: token })
    .then(function (data) { (data.kind === 'plan' ? showPlan : showAsk)(data); })
    .catch(function (e) { fail(e.message); });
})();
</script>
</body>
</html>
